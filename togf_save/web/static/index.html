<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToGf Save Editor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233b6fd8'/%3E%3Cpath d='M4 4h8v2H9v6H7V6H4z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1 id="title">ToGf Save Editor</h1>
    <div class="file">
      <label class="button primary" id="open-label">
        <span id="open-text">Open save…</span>
        <input type="file" id="open" accept=".sav" hidden>
      </label>
      <span id="filename" class="filename"></span>
      <span id="modified" class="badge" hidden></span>
    </div>
    <div class="actions">
      <button id="download" class="button primary" hidden></button>
      <button id="close" class="button" hidden></button>
      <label class="lang">
        <span id="lang-label" class="sr-only">Language</span>
        <select id="lang"></select>
      </label>
    </div>
  </header>

  <nav id="tabs" class="tabs" role="tablist" hidden></nav>

  <!-- global options, for every tab; the warning keeps its space while hidden so nothing shifts -->
  <div id="globals" class="strip" hidden>
    <label><input type="checkbox" id="show-hidden"> <span id="show-hidden-text"></span></label>
    <label><input type="checkbox" id="force"> <span id="force-text"></span></label>
    <span id="force-warning" class="strip-warn" role="status"></span>
  </div>

  <main id="main">
    <p id="start" class="start"></p>
  </main>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
